<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg width="1360" height="520" viewBox="0 0 1360 520" version="1.1" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="arrowBlue" viewBox="0 0 10 10" markerWidth="24" markerHeight="20" refX="10" refY="5"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L10,5 L0,10 Z" fill="#0b5aa7"/>
    </marker>
    <marker id="arrowRed" viewBox="0 0 10 10" markerWidth="18" markerHeight="15" refX="10" refY="5"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L10,5 L0,10 Z" fill="#e01919"/>
    </marker>
    <style>
      .serif { font-family: Georgia, "Times New Roman", serif; fill:#111; }
      .box { fill:#f8f8f8; stroke:#0b5aa7; stroke-width:3; }
      .flow { stroke:#0b5aa7; fill:none; stroke-width:4; }
      .card { fill:#f8f8f8; stroke:#999; stroke-width:2; }
    </style>
  </defs>

  <rect x="0" y="0" width="1360" height="520" fill="#f7f7f7"/>

  <!-- left + middle, nudged down to sit centred against the taller right box -->
  <g transform="translate(0,17)">

  <!-- ===== AI evolution: P -> AI evolution (fed by W) -> P' ===== -->

  <!-- initial program P -->
  <rect x="165" y="40" width="250" height="115" rx="12" class="box"/>
  <g transform="translate(257,52)">
    <rect x="0" y="0" width="65" height="58" rx="5" fill="#f7f7f7" stroke="#111" stroke-width="2.5"/>
    <line x1="0" y1="15" x2="65" y2="15" stroke="#111" stroke-width="2"/>
    <circle cx="9" cy="8" r="2.5" fill="#111"/>
    <circle cx="17" cy="8" r="2.5" fill="#111"/>
    <circle cx="25" cy="8" r="2.5" fill="#111"/>
    <text x="32.5" y="43" text-anchor="middle" font-family="Arial, sans-serif" font-size="28" font-weight="700">&lt;/&gt;</text>
  </g>
  <text x="290" y="140" text-anchor="middle" class="serif" font-size="25">Initial program <tspan font-style="italic">P</tspan></text>

  <!-- fixed workload W -->
  <rect x="20" y="198" width="110" height="90" rx="12" class="box"/>
  <text x="75" y="245" text-anchor="middle" class="serif" font-size="40" font-style="italic">W</text>
  <text x="75" y="274" text-anchor="middle" class="serif" font-size="19">workload</text>

  <!-- AI evolution -->
  <rect x="160" y="205" width="260" height="76" rx="38" class="box"/>
  <g fill="none" stroke="#111" stroke-width="7">
    <path d="M187.2,236.2 A20,20 0 0 1 220.9,229.6"/>
    <path d="M224.8,249.8 A20,20 0 0 1 191.1,256.4"/>
  </g>
  <polygon points="229.4,239.1 226.2,219.1 209.8,233.8" fill="#111"/>
  <polygon points="182.6,246.9 185.8,266.9 202.2,252.2" fill="#111"/>
  <text x="240" y="253" class="serif" font-size="28">AI evolution</text>

  <!-- evolved program P' -->
  <rect x="165" y="331" width="250" height="115" rx="12" class="box"/>
  <g transform="translate(254,343)">
    <rect x="0" y="0" width="72" height="63" rx="8" fill="none" stroke="#b01ff0" stroke-width="4"/>
    <line x1="0" y1="16" x2="72" y2="16" stroke="#b01ff0" stroke-width="4"/>
    <circle cx="10" cy="8" r="3" fill="#b01ff0"/>
    <circle cx="20" cy="8" r="3" fill="#b01ff0"/>
    <circle cx="30" cy="8" r="3" fill="#b01ff0"/>
    <text x="36" y="47" text-anchor="middle" font-family="Arial, sans-serif" font-size="30" font-weight="700" fill="#a521e8">&lt;/&gt;</text>
  </g>
  <text x="290" y="433" text-anchor="middle" class="serif" font-size="25">Evolved program <tspan font-style="italic">P′</tspan></text>

  <!-- evolution arrows -->
  <line x1="290" y1="155" x2="290" y2="204" class="flow" marker-end="url(#arrowBlue)"/>
  <line x1="130" y1="243" x2="159" y2="243" class="flow" marker-end="url(#arrowBlue)"/>
  <line x1="290" y1="281" x2="290" y2="330" class="flow" marker-end="url(#arrowBlue)"/>

  <!-- ===== P and P' both feed AIChilles ===== -->
  <path d="M415,97 C520,97 520,215 618,222" class="flow" marker-end="url(#arrowBlue)"/>
  <path d="M415,388 C520,388 520,271 618,264" class="flow" marker-end="url(#arrowBlue)"/>

  <!-- AIChilles -->
  <rect x="620" y="130" width="230" height="226" rx="12" fill="#f8f8f8" stroke="#0b5aa7" stroke-width="4"/>
  <g transform="translate(683,142)">
    <circle cx="48" cy="45" r="34" fill="none" stroke="#111" stroke-width="5"/>
    <circle cx="48" cy="45" r="22" fill="none" stroke="#111" stroke-width="4"/>
    <line x1="72" y1="70" x2="104" y2="102" stroke="#111" stroke-width="7" stroke-linecap="round"/>
  </g>
  <text x="735" y="288" text-anchor="middle" class="serif" font-size="36" font-weight="700">AIChilles</text>
  <text x="735" y="315" text-anchor="middle" class="serif" font-size="20">searches new inputs</text>
  <text x="735" y="343" text-anchor="middle" class="serif" font-size="30" font-style="italic">W′</text>

  <line x1="850" y1="243" x2="918" y2="243" class="flow" marker-end="url(#arrowBlue)"/>
  </g>

  <!-- ===== Weakness types ===== -->
  <rect x="920" y="12" width="420" height="496" rx="14" fill="#f8f8f8" stroke="#e01919" stroke-width="3" stroke-dasharray="11 8"/>
  <text x="1130" y="58" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-weight="700" font-size="38" fill="#d41414">Weakness Types</text>

  <rect x="945" y="80" width="370" height="90" rx="12" class="card"/>
  <rect x="945" y="180" width="370" height="90" rx="12" class="card"/>
  <rect x="945" y="280" width="370" height="90" rx="12" class="card"/>
  <rect x="945" y="380" width="370" height="112" rx="12" class="card"/>

  <!-- crash -->
  <g transform="translate(978,93) scale(0.7)">
    <polygon points="35,0 43,23 61,9 56,31 82,24 64,44 90,50 62,56 75,78 50,66 43,92 32,68 10,83 17,57 -8,55 12,40 -4,22 22,27"
             fill="#e01919" stroke="#e01919" stroke-width="3" stroke-linejoin="round"/>
    <polygon points="38,28 42,38 51,33 49,43 60,42 51,50 58,58 47,57 46,67 40,59 32,65 33,55 23,53 31,47 25,39 34,40" fill="#f8f8f8"/>
  </g>
  <text x="1070" y="135" class="serif" font-size="28">System crashes?</text>

  <!-- slowdown -->
  <g transform="translate(982,193) scale(0.85)" stroke="#e01919" fill="none">
    <circle cx="44" cy="41" r="31" stroke-width="6"/>
    <line x1="44" y1="41" x2="59" y2="26" stroke-width="4"/>
    <line x1="38" y1="4" x2="51" y2="4" stroke-width="5"/>
    <line x1="44.5" y1="5" x2="44.5" y2="10" stroke-width="5"/>
    <line x1="8" y1="28" x2="-2" y2="28" stroke-width="5"/>
    <line x1="8" y1="41" x2="-8" y2="41" stroke-width="5"/>
    <line x1="8" y1="54" x2="-2" y2="54" stroke-width="5"/>
  </g>
  <text x="1070" y="235" class="serif" font-size="28">Slowdown?</text>

  <!-- memory blowup: a RAM stick -->
  <g transform="translate(976,282)">
    <rect x="0" y="22" width="68" height="34" rx="3" fill="none" stroke="#e01919" stroke-width="4"/>
    <rect x="8" y="29" width="13" height="15" fill="#e01919"/>
    <rect x="27" y="29" width="13" height="15" fill="#e01919"/>
    <rect x="46" y="29" width="13" height="15" fill="#e01919"/>
    <g stroke="#e01919" stroke-width="3">
      <line x1="7" y1="56" x2="7" y2="64"/><line x1="15" y1="56" x2="15" y2="64"/><line x1="23" y1="56" x2="23" y2="64"/>
      <line x1="31" y1="56" x2="31" y2="64"/><line x1="45" y1="56" x2="45" y2="64"/><line x1="53" y1="56" x2="53" y2="64"/>
      <line x1="61" y1="56" x2="61" y2="64"/>
    </g>
  </g>
  <text x="1070" y="335" class="serif" font-size="28">Memory blowup?</text>

  <!-- worse than original -->
  <g transform="translate(968,393) scale(0.85)">
    <line x1="0" y1="67" x2="95" y2="67" stroke="#0b5aa7" stroke-width="2.5"/>
    <rect x="14" y="9" width="29" height="58" fill="#337bb6"/>
    <rect x="58" y="39" width="28" height="28" fill="#ef5a66"/>
    <line x1="44" y1="2" x2="66" y2="30" stroke="#e01919" stroke-width="3" marker-end="url(#arrowRed)"/>
    <text x="28" y="96" text-anchor="middle" class="serif" font-size="26" font-style="italic">P</text>
    <text x="72" y="96" text-anchor="middle" class="serif" font-size="26" font-style="italic">P′</text>
  </g>
  <text x="1068" y="428" class="serif" font-size="24">Worse than original?</text>
  <text x="1085" y="472" class="serif" font-size="24" font-style="italic">Perf(P) &gt; Perf(P′)</text>
</svg>
